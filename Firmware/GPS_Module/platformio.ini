[env:stm32_canbus]
platform = ststm32
board = genericSTM32F103CB
board_build.mcu = stm32f103cbt6
framework = arduino
debug_tool = stlink
upload_protocol = stlink

upload_flags =
    -c

build_flags =
    -DHAL_CAN_MODULE_ENABLED
    ; Set HSE based on physical crystal
    -DHSE_VALUE=16000000U
    -Wall
    -Wextra
    -Werror
    ; TinyGPS++ emits an intentional fallthrough warning under this toolchain.
    -Wno-implicit-fallthrough
    ; Bundled littlefs (aim_flash_storage) has unused static helpers.
    -Wno-unused-function
    -fno-exceptions

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.1.0

; aim_flash_storage pulls in a nested littlefs dependency — deep+ resolves it.
lib_ldf_mode = deep+

lib_extra_dirs =
    ; Explicitly select only required libraries from the local monorepo
    ./../../../av-libraries/
